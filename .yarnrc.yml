approvedGitRepositories: []

checksumBehavior: throw

compressionLevel: mixed

enableGlobalCache: false

enableScripts: false

enableTelemetry: false

nodeLinker: node-modules

# packages must be installed more than 10,080 minutes (7 days) ago to be considered for upgrade/install
# https://yarnpkg.com/configuration/yarnrc#npmMinimalAgeGate
npmMinimalAgeGate: 10080

# node_modules is on the shared Lando mount, so one install must serve both the host
# and the node container (@rolldown/binding-*, @parcel/watcher-*, etc.)
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
  cpu:
    - current
    - arm64
    - x64
  libc:
    - current
    - glibc
    - musl

npmRegistryServer: "https://registry.yarnpkg.com"

unsafeHttpWhitelist: []

yarnPath: .yarn/releases/yarn-4.18.0.cjs
