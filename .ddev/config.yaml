# @todo-craft update (the site is https://<name>.ddev.site)
name: craftstarter
# also writes the CRAFT_DB_* vars & PRIMARY_SITE_URL to .ddev/.env.web, which the web container loads
type: craftcms
docroot: public
php_version: "8.5"
# Apache, not nginx, like the servers: public/.htaccess & the Vite proxy (web-build/apache-vite.conf) need it
webserver_type: apache-fpm
# `ddev xdebug on` when needed: with it on, every request & command tries to connect to the IDE
xdebug_enabled: false
database:
    type: mysql
    version: "8.4"
composer_version: "2"
# read from .nvmrc
nodejs_version: auto
# relative to the docroot; kept out of the Mutagen sync
upload_dirs:
    - assets
# the Vite dev server isn't exposed: Apache proxies it at /vite-dev/ (web-build/apache-vite.conf)
web_extra_exposed_ports:
    # `ddev yarn preview` on Vite's default port, served over https by DDEV's router, which routes
    # by hostname, so every project can use the same port
    - name: vite-preview
      container_port: 4173
      http_port: 4172
      https_port: 4173
