default:
  image: xmmedia/php:8.5-cli
  timeout: 15m

stages:
  - static
  - deploy

# Select what we should cache
cache:
  # cache per job & branch
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
  paths:
    - vendor/
    - node_modules/

variables:
  SERVER_PHP_PATH: php85
  RELEASES: "$REMOTE_BASE/releases"
  SHARED: "$REMOTE_BASE/shared"

before_script:
  # install composer
  - wget --no-verbose -O composer.phar https://getcomposer.org/composer-2.phar
  # install node with nvm
  - export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh" --no-use
  - nvm install
  # .yarnrc.yml widens supportedArchitectures for the Lando node container;
  # narrow it back to the runner's own platform (doesn't affect --immutable)
  - yarn config set --json supportedArchitectures '{"os":["current"],"cpu":["current"],"libc":["current"]}'

.versions-script: &versions-script
  - php -v
  - php composer.phar --version
  - node --version
  - yarn --version

.security-checks: &security-checks
  # check for security issues in PHP libs
  - symfony security:check
  - php composer.phar audit --abandoned=report
  # check for JS security issues in libs (cap timeout at 10s)
  - YARN_HTTP_TIMEOUT=10000 yarn audit:high

static:
  stage: static
  allow_failure: false
  interruptible: true
  script:
    - *versions-script
    # install PHP dependencies
    - php composer.phar install --no-interaction --no-progress --ignore-platform-reqs
    # Install node/JS dependencies
    - yarn install --immutable
    # composer & yarn require packages to be installed before running security checks
    - *security-checks
    # lint JS & CSS
    - yarn lint:js
    - yarn lint:css
    # lint Twig templates & project config YAML
    - php composer.phar lint:twig
    - php composer.phar lint:yaml

.deploy template: &deploy
  stage: deploy
  allow_failure: false
  only:
    # @todo-craft update to match main branch name
    - master
  script:
    - *versions-script
    # install PHP dependencies
    - php composer.phar install --no-interaction --no-progress --ignore-platform-reqs --no-dev
    # Install node/JS dependencies
    - yarn install --immutable
    # composer & yarn require packages to be installed before running security checks
    - *security-checks
    # helpers for the rest of the job (its lines all run in one shell):
    # run a command on the server; run a craft console command in a release dir
    - remote () { ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_SERVER" "$@"; }
    - craft () { dir=$1; shift; remote "cd $dir && $SERVER_PHP_PATH craft $*"; }
    # setup vars for paths
    - TIMESTAMP=$(date +%s); RELEASE="$RELEASES/$TIMESTAMP"
    - echo "Paths:"; echo $REMOTE_BASE; echo $RELEASE; echo $SHARED
    - echo "Remote:"; echo $REMOTE_USER@$REMOTE_SERVER:$REMOTE_PORT
    # setup SSH & private key
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - ssh-keyscan -p $REMOTE_PORT $REMOTE_SERVER >> ~/.ssh/known_hosts
    # the following line is optional (likely remove previous line)
    #- echo "$SSH_SERVER_HOSTKEYS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # add .revision file
    - git rev-parse --verify --short HEAD > .revision
    # create partial .env file (empty as yarn doesn't need anything)
    - touch .env
    - yarn build
    # remove temp .env file just in case
    - rm .env
    # ensure based paths exist
    - remote "mkdir -p $RELEASES $SHARED $SHARED/storage $SHARED/public/assets"
    # sync files to release directory
    - rsync --archive --stats --human-readable --no-perms --exclude ".git/" --exclude ".idea/" --exclude "node_modules/" --exclude "vendor/" --exclude "cypress/" -e "ssh -p $REMOTE_PORT" . $REMOTE_USER@$REMOTE_SERVER:$RELEASE
    # make craft console file executable
    - remote "chmod u+x $RELEASE/craft"
    # ensure platform has all requirements & install packages on the server
    - remote "$SERVER_PHP_PATH -v; echo; cd $RELEASE && $SERVER_PHP_PATH composer.phar check-platform-reqs && $SERVER_PHP_PATH composer.phar install --no-dev --no-interaction --no-progress"
    # move craft rebrand logos into place
    - remote "rm -rf $SHARED/storage/rebrand && cp -ar $RELEASE/config/rebrand $SHARED/storage"
    # link shared folders
    - remote "cd $RELEASE && rm -rf storage public/assets && ln -s $SHARED/storage storage && ln -s $SHARED/public/assets public/assets"
    # copy env file into place
    - remote "cp -a $SHARED/.env $RELEASE/.env"
    # switch to new version
    - remote "ln -sfn $RELEASE $REMOTE_BASE/current"
    # apply changes to craft config, migrations
    - |
      craft $REMOTE_BASE/current up
      craft $REMOTE_BASE/current clear-caches/all
    # reload php-fpm (to reset cache)
    - remote "sudo /bin/systemctl reload php85-php-fpm"
    # remove >2 releases
    - remote "ls -1d $RELEASES/* | sort -rg | tail -n +3 | xargs /bin/rm -rf"
    # test if website is up
    - if wget --spider --server-response "$REQUEST_CONTEXT_SCHEME://$REQUEST_CONTEXT_HOST" 2>&1 | grep '200\ OK'; then echo "$REQUEST_CONTEXT_SCHEME://$REQUEST_CONTEXT_HOST is up"; else echo "$REQUEST_CONTEXT_SCHEME://$REQUEST_CONTEXT_HOST is down"; exit 1; fi
    # success message
    - echo "Deployment completed successfully. Release at $RELEASE"

deploy to staging:
  <<: *deploy
  environment:
    name: staging
    url: $STAGING_URL
  when: manual

deploy to prod:
  <<: *deploy
  environment:
    name: production
    url: $PROD_URL
  when: manual
