# @todo-craft update
# URLs: https://craftstarter.lndo.site/
# DB_SERVER: database
# DB_PORT: 3306
# DB_DATABASE: craft
# DB_USER: craft
# DB_PASSWORD: craft
# @todo-craft update
name: craftstarter
recipe: symfony
config:
  config:
    php: lando_php.ini
    database: lando_mysql.cnf
  php: '8.5'
  database: mysql:8.4
  webroot: public
  xdebug: true
services:
  appserver:
    type: php:8.5
    build_as_root:
      # LANG: build steps inherit the host's, which the image doesn't have (perl warnings)
      - LANG=C.UTF-8 a2enmod headers
      # proxy the Vite dev server (node service) at /vite-dev/ — see lando_apache_vite.conf
      - LANG=C.UTF-8 a2enmod proxy proxy_http proxy_wstunnel proxy_balancer lbmethod_byrequests
      - ln -sf /app/lando_apache_vite.conf /etc/apache2/conf-enabled/vite.conf
      # to fix the "Xdebug: [Log Files] File '/tmp/xdebug.log' could not be opened." error
      - touch /tmp/xdebug.log && chmod 666 /tmp/xdebug.log
      # insurance against git's "dubious ownership" refusal if the mount's uid ever
      # stops matching the container user (composer shells out to git, e.g. `validate`)
      - LANG=C.UTF-8 git config --system --add safe.directory /app
  database:
    creds:
      user:     craft
      password: craft
      database: craft
  phpmyadmin:
    type: phpmyadmin
    ssl: true
    sslExpose: false
    hosts:
      - database
  node:
    type: node:24
    ssl: true
    sslExpose: false
    ports:
      # `yarn preview` (must match vite.config.mjs)
      # @todo-craft change port number 2x
      - '9528:9528'
    # note: the Vite port is deliberately NOT published — the appserver proxies to it over
    # the internal network, and publishing it would shadow a host-run `yarn dev`
    build:
      - corepack enable
    overrides:
      environment:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
proxy:
  appserver:
    # @todo-craft update
    - craftstarter.lndo.site
  phpmyadmin:
    # @todo-craft update
    - pma.craftstarter.lndo.site
tooling:
  console:
    disabled: true
  yarn:
    service: node
    description: Run a yarn command.
  vite:
    service: node
    description: Install packages, then run the Vite dev server.
    cmd:
      - yarn install
      - yarn dev
  vite-stop:
    service: node
    description: Stop the Vite dev server left running in the container.
    cmd: pkill -f vite || true
  craft:
    service: appserver
    description: Run a Craft CMS console command.
    cmd: /app/craft
  xdebug-on:
    service: appserver
    description: Enable xdebug for apache.
    cmd: "docker-php-ext-enable xdebug && /etc/init.d/apache2 reload"
    user: root
  xdebug-off:
    service: appserver
    description: Disable xdebug for apache.
    cmd: "rm /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini && /etc/init.d/apache2 reload"
    user: root
