# @todo-craft update
# URLs: https://craftstarter.lndo.site/
# DB_SERVER: database
# DB_PORT: 3306
# DB_DATABASE: craft
# DB_USER: craft
# DB_PASSWORD: craft
# @todo-craft update
name: craftstarter
recipe: symfony
config:
  config:
    php: lando_php.ini
    database: lando_mysql.cnf
  php: '8.5'
  database: mysql:8.4
  webroot: public
  xdebug: true
services:
  appserver:
    type: php:8.5
    build_as_root:
      - a2enmod headers
      # to fix the "Xdebug: [Log Files] File '/tmp/xdebug.log' could not be opened." error
      - touch /tmp/xdebug.log && chmod 666 /tmp/xdebug.log
  database:
    creds:
      user:     craft
      password: craft
      database: craft
  phpmyadmin:
    type: phpmyadmin
    ssl: true
    sslExpose: false
    hosts:
      - database
  node:
    type: node:24
    ssl: true
    sslExpose: false
    ports:
      # @todo-craft change port number 2x (must match vite.config.mjs)
      - '9028:9028'
      # `yarn preview` (vite's default port)
      - '4173:4173'
    build:
      - corepack enable
    overrides:
      environment:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
proxy:
  appserver:
    # @todo-craft update
    - craftstarter.lndo.site
  phpmyadmin:
    # @todo-craft update
    - pma.craftstarter.lndo.site
tooling:
  console:
    disabled: true
  yarn:
    service: node
    description: Run a yarn command.
  vite:
    service: node
    description: Run the Vite dev server.
    cmd: yarn dev
  vite-stop:
    service: node
    description: Stop the Vite dev server left running in the container.
    cmd: pkill -f vite || true
  craft:
    service: appserver
    description: Run a Craft CMS console command.
    cmd: /app/craft
  xdebug-on:
    service: appserver
    description: Enable xdebug for apache.
    cmd: "docker-php-ext-enable xdebug && /etc/init.d/apache2 reload"
    user: root
  xdebug-off:
    service: appserver
    description: Disable xdebug for apache.
    cmd: "rm /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini && /etc/init.d/apache2 reload"
    user: root
